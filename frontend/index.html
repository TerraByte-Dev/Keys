<!doctype html>
<html lang="en" data-view="play">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keys</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-180.png">
</head>
<body>

<!-- ── top rail: the hardware status strip ───────────────────────────────── -->
<header class="rail">
  <div class="rail__brand">
    <span class="rail__mark" aria-hidden="true"></span>
    <span class="rail__name">Keys</span>
  </div>

  <div class="rail__lamps" id="lamps">
    <div class="lamp" id="lamp-midi" title="MIDI input">
      <i class="lamp__led"></i><span class="lamp__label">MIDI</span>
      <span class="lamp__value" id="lamp-midi-value">--</span>
    </div>
    <div class="lamp" id="lamp-audio" title="Audio buffer">
      <i class="lamp__led"></i><span class="lamp__label">BUF</span>
      <span class="lamp__value" id="lamp-audio-value">--</span>
    </div>
    <div class="lamp" id="lamp-voices" title="Active voices">
      <i class="lamp__led"></i><span class="lamp__label">VOICE</span>
      <span class="lamp__value" id="lamp-voices-value">0</span>
    </div>
    <div class="lamp" id="lamp-link" title="Connection to the app">
      <i class="lamp__led"></i><span class="lamp__label">LINK</span>
      <span class="lamp__value" id="lamp-link-value">--</span>
    </div>
  </div>

  <div class="rail__right">
    <div class="clock" title="Time actually spent playing today, not time with the app open">
      <span class="clock__label">TODAY</span>
      <span class="clock__value" id="today-clock">0:00</span>
      <i class="clock__dot" id="playing-dot" title="lit while you are playing"></i>
    </div>
    <button class="btn btn--panic" id="panic" title="All notes off (Esc)">PANIC</button>
    <!-- Output volume. It is synth.gain, the one audio setting FluidSynth will take
         live without renegotiating the stream, which is why it can sit out here
         instead of behind the gear with the ones that need a restart. -->
    <label class="vol" title="Output volume">
      <svg class="vol__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h3.5L12 19V5L7.5 9H4z"/>
        <path d="M15.6 8.6a4.5 4.5 0 0 1 0 6.8" class="vol__wave"/>
        <path d="M18.2 6a8 8 0 0 1 0 12" class="vol__wave vol__wave--far"/>
      </svg>
      <input class="vol__slider" type="range" id="vol" min="0" max="150" step="1" value="60"
             aria-label="Output volume">
      <span class="vol__value" id="vol-value">60</span>
    </label>
    <button class="railbtn" id="gear" title="Settings — themes, shortcuts, updates" aria-haspopup="dialog">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ── left nav: view selector ───────────────────────────────────────────── -->
<nav class="nav" id="nav">
  <a class="nav__item is-active" href="#play"     data-view="play"><span class="nav__key">1</span>Play</a>
  <a class="nav__item"           href="#practice" data-view="practice"><span class="nav__key">2</span>Practice</a>
  <a class="nav__item"           href="#layers"   data-view="layers"><span class="nav__key">3</span>Layers</a>
  <a class="nav__item"           href="#tools"    data-view="tools"><span class="nav__key">4</span>Tools</a>
  <a class="nav__item"           href="#stats"    data-view="stats"><span class="nav__key">5</span>Stats</a>
  <a class="nav__item"           href="#settings" data-view="settings"><span class="nav__key">6</span>Sound</a>
</nav>

<!-- ── the view ──────────────────────────────────────────────────────────── -->
<main class="stage" id="stage" tabindex="-1"></main>

<!-- ── the roll. Full screen or not at all — there is no half. ───────────── -->
<section class="roll" id="roll" aria-hidden="true">
  <button class="roll__exit" id="roll-exit" title="Back to the app (Esc)">
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M4.2 1H1v3.2M11 4.2V1H7.8M7.8 11H11V7.8M1 7.8V11h3.2"/>
    </svg>
    EXIT
  </button>

  <!-- The songs drawer. Importing music belongs where you play it, not three tabs
       away behind an engraver — so this is the one place a .mid goes in, and it
       lands on the roll rather than on a page of notation. -->
  <button class="songs__tab" id="songs-tab" title="Your songs (S)" aria-expanded="false">
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M1.5 2.5h9M1.5 6h9M1.5 9.5h5.5"/>
    </svg>
    SONGS
  </button>
  <aside class="songs" id="songs" aria-label="Songs" hidden>
    <div class="songs__head">
      <span class="songs__heading">SONGS</span>
      <button class="songs__x" id="songs-close" title="Close (S)">&times;</button>
    </div>
    <button class="btn btn--wide" id="songs-add">Import a MIDI&hellip;</button>
    <input type="file" id="songs-file" accept=".mid,.midi,.musicxml,.mxl,.xml" hidden>
    <div class="songs__list" id="songs-list"></div>
    <p class="songs__note">
      A <strong>.mid</strong> lands straight on the roll — silent, no engraving.
      Drop one anywhere on this screen.
    </p>
  </aside>

  <!-- The roll's own controls. Inside #roll rather than in a view, because immersive
       collapses .stage to nothing — and immersive is now the only way the roll opens.
       Speed and EXIT are always here; the song controls appear with a song. -->
  <div class="rollbar" id="rollbar" hidden>
    <span class="rollbar__title" id="ghost-title"></span>
    <span class="rollbar__song" id="ghost-song" hidden>
      <!-- Falling notes or the printed page, for the same piece. Inside #ghost-song so
           it arrives and leaves with a song, because neither view means anything
           without one. -->
      <span class="rollbar__mode" id="roll-mode" role="group" aria-label="How to show this song">
        <button class="btn is-on" data-mode="roll" title="Falling notes">Roll</button>
        <button class="btn" data-mode="sheet"
                title="The printed score. Same piece, engraved — the clock keeps running underneath.">Sheet</button>
      </span>
      <span class="rollbar__pages" id="roll-pages" hidden>
        <button class="btn" id="roll-page-prev" title="previous page">&lsaquo;</button>
        <span class="rollbar__page" id="roll-page-n"></span>
        <button class="btn" id="roll-page-next" title="next page">&rsaquo;</button>
      </span>
      <button class="btn" id="ghost-play">Play</button>
      <button class="btn" id="ghost-restart" title="back to the beginning">|&lsaquo;</button>
      <button class="btn" id="ghost-wait" aria-pressed="true"
              title="Freeze at each chord until you have played it. It waits as long as you need.">Wait</button>
      <button class="btn" id="ghost-skip"
              title="Move past this chord (→). Nothing skips on its own.">Skip</button>
      <span class="rollbar__hands" id="ghost-hands" role="group" aria-label="Which hand">
        <button class="btn is-on" data-hands="both">Both</button>
        <button class="btn" data-hands="R">R</button>
        <button class="btn" data-hands="L">L</button>
      </span>
      <label class="field rollbar__knob">
        <span class="field__label"><span>Tempo</span><span class="field__value" id="ghost-bpm-v">100</span></span>
        <input type="range" id="ghost-bpm" min="20" max="240" step="1" value="100">
      </label>
    </span>
    <label class="field rollbar__knob" title="How far ahead you can see. Nothing to do with the music.">
      <span class="field__label"><span>Speed</span><span class="field__value" id="roll-speed-live">100</span></span>
      <input type="range" id="roll-speed" min="40" max="240" step="5" value="100">
    </label>
    <span class="rollbar__read" id="ghost-read"></span>
    <button class="btn" id="ghost-close" hidden>Close song</button>
    <div class="transport__scrub rollbar__scrub" id="ghost-scrub" hidden>
      <div class="transport__fill" id="ghost-fill"></div>
    </div>
  </div>

  <!-- The printed page, over the roll rather than instead of it. The ghost clock keeps
       running underneath: wait mode still waits for you, the bar count still counts,
       and switching back puts you where the piece actually got to. -->
  <div class="rollpaper paper" id="roll-paper" hidden></div>
</section>

<!-- ── readout strip above the keys ──────────────────────────────────────── -->
<section class="readout">
  <div class="readout__chord">
    <span class="readout__label">CHORD</span>
    <output class="readout__value" id="chord-symbol">—</output>
    <span class="readout__sub" id="chord-name"></span>
  </div>
  <div class="readout__notes">
    <span class="readout__label">NOTES</span>
    <output class="readout__list" id="note-list"></output>
  </div>
  <div class="readout__meta">
    <span class="pedal" id="pedal" title="Sustain pedal (CC64)">
      <i class="pedal__led"></i>SUSTAIN
    </span>
    <span class="readout__label">VEL</span>
    <output class="readout__vel" id="last-vel">—</output>
    <button class="rolltoggle" id="roll-toggle" title="The roll, full screen — play along with a MIDI, or watch what you play (V)" aria-pressed="false">
      <i class="rolltoggle__bars" aria-hidden="true"><i></i><i></i><i></i></i>
      <span class="rolltoggle__label">ROLL</span>
    </button>
  </div>
</section>

<!-- ── the instrument. always here, whatever view you are in. ────────────── -->
<section class="dock" id="dock" aria-label="88-key keyboard"></section>

<!-- ── transient notices ─────────────────────────────────────────────────── -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
